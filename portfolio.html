  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAttItfCKpUmup8oDI-uRchYW2T1-z9TTM",
      authDomain: "my-github-portfolio-66f85.firebaseapp.com",
      projectId: "my-github-portfolio-66f85",
      storageBucket: "my-github-portfolio-66f85.appspot.com",  // <-- fix: should be .appspot.com
      messagingSenderId: "504416162977",
      appId: "1:504416162977:web:6bfef4825d041ece73cce0",
      measurementId: "G-C2339D2RZV"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    async function loadProjects() {
      document.getElementById("portfolio_loader").style.display = "block";

      try {
        const q = query(collection(db, "projects"), orderBy("order", "asc"));
        const querySnapshot = await getDocs(q);

        const list = document.getElementById("project-list");
        list.innerHTML = ""; // clear old items

        querySnapshot.forEach((doc) => {
          const data = doc.data();

          const li = document.createElement("li");
          li.style.maxHeight = "300px";
          li.style.overflow = "hidden";
          li.style.boxSizing = "border-box";

          li.innerHTML = ` <a href="${data.link}" style="display:block; text-align:center;"> <img src="${data.image}" alt="Project Screenshot" style="max-height:260px; max-width:100%; object-fit:contain; border-radius:8px;"> <div class="text" style="margin-top:10px;"> <h3>${data.title}</h3> <span>Visit Source</span> </div> </a> `;

          list.appendChild(li);
        });
      } catch (error) {
        console.error("Error loading projects:", error);
      } finally {
        // Hide loader after fetching
        document.getElementById("portfolio_loader").style.display = "none";
      }
    }

    loadProjects();
  </script>
